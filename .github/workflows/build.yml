name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Skip the regular build when the push is a release tag (release job covers it)
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    name: Lint, Test & Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Lint and unit tests
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK exists and is non-empty
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK" || { echo "::error::APK not found"; exit 1; }
          SIZE=$(stat -c%s "$APK")
          test "$SIZE" -gt 1000000 || { echo "::error::APK suspiciously small: $SIZE bytes"; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "Found $APK ($SIZE bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDNHunterPro-debug-apk
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Upload lint & test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  release:
    # On v* tags: run tests and publish the APK to GitHub Releases.
    # If signing secrets are configured, a signed release APK is built;
    # otherwise the debug-signed APK is attached and the signing status is
    # reported in the release notes.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Prepare release signing (optional)
        id: signing
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_KEYSTORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets detected — building a signed release APK."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets configured — the debug-signed APK will be attached instead."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        run: |
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$RELEASE_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$RELEASE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="${RELEASE_KEY_PASSWORD:-$RELEASE_KEYSTORE_PASSWORD}" \
            --stacktrace

      - name: Build debug APK (fallback)
        if: steps.signing.outputs.signed != 'true'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Locate and verify APK
        id: apk
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
            KIND="release-signed"
          else
            APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
            KIND="debug-signed (configure RELEASE_* secrets for a release signature)"
          fi
          test -n "$APK" || { echo "::error::APK not found"; exit 1; }
          SIZE=$(stat -c%s "$APK")
          test "$SIZE" -gt 1000000 || { echo "::error::APK suspiciously small"; exit 1; }
          cp "$APK" "CDNHunterPro-${GITHUB_REF_NAME}-$([ "$KIND" = "release-signed" ] && echo release || echo debug).apk"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "APK verified: $APK ($SIZE bytes, $KIND)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: CDNHunterPro-*.apk
          body: |
            Automated release for ${{ github.ref_name }}.

            - Unit tests: passed
            - APK kind: ${{ steps.apk.outputs.kind }}
            - Install: enable "install unknown apps" for your file manager, then open the APK.
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
